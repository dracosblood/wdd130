<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Basic Quiz Form</title>
</head>

<body>
    <main class="box">
        <h1>✔ Basic HTML and CSS quiz</h1>
        <form action="" class="box">
            <div class="quiz-item box">
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">What of the following is a valid CSS comment?</label>
                <select name="q3" id="q1">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="">A.&lt;!-- This is a comment --!&gt; </option>
                    <option value="">B. /* This is a comment */</option>
                    <option value="">C. // This is a comment //</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px</code>
                <input type="text" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
</body>

</html>
